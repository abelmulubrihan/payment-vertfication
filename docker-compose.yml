version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: payverify_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: payverify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payverify_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/payverify_db
      - SECRET_KEY=payverify_ethiopia_super_secret_jwt_key_2026_change_in_prod
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: payverify_dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
